# ---------------------------------------------------------------------------
# zmkbat — i3blocks block for the charge of both halves of a ZMK split.
#
# Paste into ~/.config/i3blocks/config (or ~/.i3blocks.conf).
#
# zmkbat exits with 2 when a half is at or below --low, and i3blocks maps
# that to its "critical" colour without any extra configuration.
# ---------------------------------------------------------------------------

[zmkbat]
command=zmkbat -f polybar -t 30
interval=30
label=KB
