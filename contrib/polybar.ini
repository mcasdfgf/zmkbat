; ---------------------------------------------------------------------------
; zmkbat — Polybar module for the charge of both halves of a ZMK split.
;
; Paste into ~/.config/polybar/config.ini and add "zmkbat" to modules-right.
;
; interval and --ttl are kept equal on purpose: the bar asks every 10 seconds,
; the cache answers for 10 seconds, so a real Bluetooth read happens once per
; 10 seconds per bar. Two bars on two monitors still share one read.
;
; Left click opens the detailed view in rofi (a fresh read, not the cache).
; Right click forces a refresh of the cached value.
; ---------------------------------------------------------------------------

[module/zmkbat]
type = custom/script
exec = zmkbat -f polybar -t 10
interval = 10
format-prefix = "KB "
format-prefix-foreground = ${colors.primary}
label = %output%
click-left = zmkbat --refresh -f text | rofi -dmenu -p "battery" -no-custom
click-right = zmkbat --refresh -f polybar >/dev/null
