[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zmkbat"
version = "0.1.0"
description = "Battery levels for both halves of a ZMK split keyboard, for polybar, waybar, i3blocks and scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcasdfgf" }]
keywords = ["zmk", "keyboard", "battery", "bluetooth", "bluez", "polybar", "waybar", "i3blocks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["dbus-python>=1.2.16"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
zmkbat = "zmkbat.cli:main"

[project.urls]
Homepage = "https://github.com/mcasdfgf/zmkbat"
Issues = "https://github.com/mcasdfgf/zmkbat/issues"
Changelog = "https://github.com/mcasdfgf/zmkbat/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/zmkbat"]

[tool.hatch.build.targets.sdist]
include = ["src/zmkbat", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zmkbat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
